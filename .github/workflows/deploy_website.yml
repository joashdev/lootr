name: Deploy website

on:
  workflow_dispatch:

concurrency:
  group: website-production
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lootr-bhl.pages.dev

    steps:
      - name: Trigger Cloudflare Pages deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            --url "$DEPLOY_HOOK_URL"
