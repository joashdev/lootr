name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub

# NOTE: everything under integration_test/ is intentionally NOT run in CI, and
# there is no emulator job. Integration tests require a connected device; on a
# hosted runner that means the Android emulator, whose nested-virtualization
# QEMU hangs under the heavy storyboard_*_test.dart screenshot-capture tools
# (they boot the whole app and drive full user journeys). The one lightweight
# smoke test (test_infrastructure_flow_test.dart) only exercises the Drift repos,
# which the unit suite already covers more thoroughly (see
# test/data/repositories/transaction_repo_test.dart). Run integration tests
# locally against a simulator, e.g.:
#   flutter drive \
#     --driver=test_driver/integration_test.dart \
#     --target=integration_test/storyboard_journey_test.dart -d <udid>
