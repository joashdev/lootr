name: Bug report
description: Report a reproducible problem in Lootr
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Lootr. GitHub issues are public.
        Never include balances, transactions, account details, receipts,
        database files, backups, tokens, or other private information.
  - type: input
    id: version
    attributes:
      label: Lootr version and build
      description: Find this under More → About.
      placeholder: 0.1.0-alpha.1, build 42
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem using synthetic or redacted examples.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Optional. Use only screenshots or logs containing synthetic or redacted data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private financial, authentication, and personal information.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
