name = "lootr-report-relay"
main = "src/index.ts"
compatibility_date = "2026-07-27"

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[vars]
GITHUB_OWNER = "joashdev"
GITHUB_REPO = "lootr"
ATTACHMENT_RETENTION_DAYS = "30"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "lootr-report-screenshots"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
