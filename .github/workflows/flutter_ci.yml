name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - run: flutter test --no-pub
      # Headless integration smoke test: uses an in-memory Drift DB and pumps no
      # widgets, so it runs under flutter_tester without an emulator. Must be a
      # separate `flutter test` invocation — the tool refuses to run unit and
      # integration tests in one call.
      - run: flutter test --no-pub integration_test/test_infrastructure_flow_test.dart

# NOTE: the storyboard_*_test.dart files under integration_test/ are NOT run in
# CI. They are `flutter drive` screenshot-capture tools that boot the whole app
# and drive full user journeys to regenerate docs/storyboard-shots/. They are
# far too heavy for a hosted runner's nested-virtualization emulator (they hang
# QEMU) and require the integration_test driver + a real device. Run them
# locally against a simulator, e.g.:
#   flutter drive \
#     --driver=test_driver/integration_test.dart \
#     --target=integration_test/storyboard_journey_test.dart -d <udid>
